<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="Inter, system-ui, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2e5bff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1060" cy="110" r="340" fill="#2e5bff" opacity="0.13"/>
  <circle cx="140" cy="560" r="240" fill="#38bdf8" opacity="0.08"/>

  <!-- Brand -->
  <g transform="translate(80,72)">
    <rect x="0" y="0" width="60" height="74" rx="10" fill="url(#accent)"/>
    <text x="30" y="52" font-size="40" font-weight="800" fill="#fff" text-anchor="middle">P</text>
    <text x="78" y="54" font-size="52" font-weight="800" fill="#f8fafc">Pyntra</text>
  </g>

  <!-- Headline -->
  <text x="80" y="246" font-size="56" font-weight="800" fill="#f8fafc">Your private document &amp; design studio</text>
  <text x="80" y="306" font-size="30" font-weight="600" fill="#38bdf8">Edit · Convert · Design · Sign — 100% in your browser, nothing uploaded</text>

  <!-- Feature lines -->
  <text x="80" y="376" font-size="28" font-weight="500" fill="#cbd5e1">PDF · Word · Excel · PowerPoint · Markdown · Images</text>
  <text x="80" y="420" font-size="28" font-weight="500" fill="#cbd5e1">Design studio · Résumé &amp; cover letter · QR codes · OCR · Real redaction</text>

  <!-- Capability pills -->
  <g font-size="22" font-weight="700" text-anchor="middle">
    <g>
      <rect x="80" y="460" width="300" height="46" rx="23" fill="none" stroke="#38bdf8" stroke-width="2"/>
      <text x="230" y="489" fill="#e2e8f0">⚡ Real-time collaboration</text>
    </g>
    <g>
      <rect x="398" y="460" width="190" height="46" rx="23" fill="none" stroke="#38bdf8" stroke-width="2"/>
      <text x="493" y="489" fill="#e2e8f0">✓ 100% private</text>
    </g>
    <g>
      <rect x="606" y="460" width="220" height="46" rx="23" fill="none" stroke="#38bdf8" stroke-width="2"/>
      <text x="716" y="489" fill="#e2e8f0">↓ Installable app</text>
    </g>
    <g>
      <rect x="844" y="460" width="230" height="46" rx="23" fill="none" stroke="#38bdf8" stroke-width="2"/>
      <text x="959" y="489" fill="#e2e8f0">★ Free · no account</text>
    </g>
  </g>

  <!-- Footer -->
  <g transform="translate(80,548)">
    <rect x="0" y="0" width="250" height="50" rx="25" fill="url(#accent)"/>
    <text x="125" y="33" font-size="22" font-weight="700" fill="#fff" text-anchor="middle">Open Pyntra free →</text>
  </g>
  <text x="360" y="580" font-size="26" font-weight="600" fill="#94a3b8">pyntra.tekivex.com</text>
</svg>
